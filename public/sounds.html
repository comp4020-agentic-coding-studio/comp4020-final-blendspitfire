<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sound sheet</title>
    <style>
      html, body { margin: 0; background: #111; color: #eee; font: 14px system-ui, sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.note { opacity: 0.65; margin: 0 0 16px; }
      .rooms { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
      .rooms button.on { background: #e8dcc0; color: #111; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; margin: 22px 0 8px; }
      .row { display: grid; grid-template-columns: 170px 1fr auto; gap: 12px; align-items: center; padding: 7px 0; border-top: 1px solid #222; }
      .row .what { opacity: 0.7; }
      button { font: inherit; background: #2a2a2a; color: #eee; border: 1px solid #444; padding: 6px 12px; cursor: pointer; }
      button:hover { border-color: #888; }
      @media (max-width: 560px) { .row { grid-template-columns: 1fr auto; } .row .what { grid-column: 1 / -1; order: 3; } }
    </style>
  </head>
  <body>
    <main id="sheet"></main>
    <script type="module" src="sounds.js"></script>
  </body>
</html>
