<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commons</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <style>
      /* One look for every piece of UI: an old company terminal. A pixel
         face in a warm phosphor white with a faint glow, chunky two-pixel
         frames with stepped corners, a dark wash behind so it reads on the
         bright garden and in the dark alike. Grey is "not available". */
      :root { --ui: #f2ead6; --ui-dim: #8f8a7e; --ui-wash: rgba(6, 8, 6, 0.62); --ui-glow: rgba(255, 220, 160, 0.35);
        --ui-font: 400 19px/1.05 "VT323", ui-monospace, "SF Mono", Menlo, monospace; }
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      canvas { display: block; }
      .ui-frame, #leaderboard, #board .board-panel, #shop .board-panel, .ui-report, .ui-hud, .ui-ready, .ui-name, .ui-settle, .ui-wounds, .ui-spectate, .ui-banner, #connection-lost {
        position: fixed; color: var(--ui); font: var(--ui-font); letter-spacing: 0.06em; text-transform: uppercase;
        padding: 8px 12px; pointer-events: none; text-shadow: 0 0 6px var(--ui-glow), 0 1px 0 #000;
        border: 2px solid var(--ui-dim); border-radius: 0;
        /* stepped corners: the frame's corners knocked out one pixel-step, like a sprite's */
        clip-path: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px,
          100% calc(100% - 4px), calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%,
          4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 2px 4px, 2px 2px, 4px 2px);
        background-color: var(--ui-wash);
        /* faint scanlines through every panel */
        background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
        image-rendering: pixelated; -webkit-font-smoothing: none; font-smooth: never;
      }
      #hint {
        position: fixed; left: 14px; bottom: 10px; color: var(--ui); font: var(--ui-font);
        letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.9; pointer-events: none;
        text-shadow: 0 0 6px var(--ui-glow), 0 1px 0 #000; -webkit-font-smoothing: none;
      }
      #hint::before { content: "> "; color: var(--ui-dim); }
      #hint a { pointer-events: auto; color: var(--ui-dim); }
      #tip {
        position: fixed; left: 0; top: 0; display: none; pointer-events: none;
        color: var(--ui); font: var(--ui-font); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
        border-left: 4px solid var(--ui); padding: 2px 8px; background: var(--ui-wash); text-shadow: 0 0 6px var(--ui-glow);
      }
      #respawn {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: var(--ui); font: 400 96px "VT323", ui-monospace, monospace; text-shadow: 0 0 14px var(--ui-glow), 0 3px 0 #000;
        pointer-events: none; display: none;
      }
      #leaderboard { left: 14px; top: 14px; min-width: 150px; }
      #leaderboard .row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
      #leaderboard .swatch { width: 10px; height: 10px; flex: none; border: 2px solid var(--ui-dim); }
      #leaderboard .score { margin-left: auto; font-variant-numeric: tabular-nums; }
      #leaderboard .me { color: var(--ui); }
      #leaderboard .row:not(.me) { color: #d8d8d8; }
      /* the scoreboard: closed, it's only the screen in the garden; open, a tall panel mid-screen */
      #board, #shop { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; }
      #shop { place-items: center end; padding-right: 4vw; }
      #shop.open .board-panel { pointer-events: auto; }
      #shop .row { cursor: pointer; flex-wrap: wrap; }
      #shop .key { width: 2.4em; }
      #shop .why { flex-basis: 100%; padding-left: 2.4em; font-size: 16px; }
      #shop .row:not(.dim):hover { background: var(--ui); color: #0a0c0a; text-shadow: none; }
      #board .board-panel, #shop .board-panel { position: relative; min-width: 300px; max-width: min(420px, 86vw); padding: 18px 22px;
        background-color: rgba(6, 8, 6, 0.88);
        opacity: 0; transform: translateY(8px) scaleY(0.96); transition: opacity 0.22s, transform 0.22s; }
      #board.open .board-panel, #shop.open .board-panel { opacity: 1; transform: none; }
      #board .title, #shop .title { margin: 6px 0 4px; padding-bottom: 3px; border-bottom: 2px dashed var(--ui-dim); font-size: 24px; }
      #board .run, #shop .run { color: var(--ui-dim); margin-bottom: 6px; }
      #board .row, #shop .row { display: flex; gap: 8px; padding: 2px 0; }
      #board .rank { width: 1.4em; color: var(--ui-dim); }
      #board .score, #shop .score { margin-left: auto; font-variant-numeric: tabular-nums; }
      #board .dim, #board .legend, #shop .dim, #shop .legend { color: var(--ui-dim); }
      #board .legend, #shop .legend { margin-top: 8px; font-size: 16px; }
      .ui-hud { top: 10px; left: 50%; transform: translateX(-50%); display: none; padding: 3px 12px; font-size: 17px; opacity: 0.92; }
      .ui-hud .line { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
      /* the reactor as a thin row of blocks lit up to its health, not a smooth fill */
      .ui-hud .bar { display: inline-block; width: 120px; height: 6px; border: 1px solid var(--ui-dim); position: relative; padding: 1px; }
      .ui-hud .bar > span { display: block; height: 100%; transition: width 0.3s steps(8);
        background: repeating-linear-gradient(90deg, var(--ui) 0 5px, transparent 5px 7px); }
      .ui-hud .bar.hp > span.low { background: repeating-linear-gradient(90deg, #ff5a4a 0 5px, transparent 5px 7px); }
      .ui-hud .next { color: var(--ui-dim); }
      .ui-ready { left: 50%; bottom: 46px; transform: translateX(-50%); display: none; align-items: center; gap: 12px;
        padding: 6px 16px 6px 8px; border-color: var(--ui); white-space: nowrap; }
      .ui-ready.open { display: flex; }
      .ui-ready .key { font-size: 30px; line-height: 1; padding: 2px 10px 0; border: 2px solid var(--ui); color: #0b0c0e; background: var(--ui);
        text-shadow: none; animation: ready-pulse 1.2s step-end infinite; }
      .ui-ready.done .key { background: transparent; color: var(--ui-dim); border-color: var(--ui-dim); animation: none; }
      .ui-ready .what { font-size: 22px; }
      .ui-ready .who { color: var(--ui-dim); }
      @keyframes ready-pulse { 0% { background: var(--ui); color: #0b0c0e; } 50% { background: transparent; color: var(--ui); } }
      .ui-name { left: 50%; top: 38%; transform: translate(-50%, -50%); display: none; flex-direction: column; align-items: center; gap: 6px;
        padding: 16px 28px; border-color: var(--ui); pointer-events: auto; z-index: 20; }
      .ui-name.open { display: flex; }
      .ui-name .title { font-size: 28px; }
      .ui-name .dim { color: var(--ui-dim); }
      .ui-name input { font: 400 40px/1 "VT323", ui-monospace, monospace; letter-spacing: 0.18em; text-transform: uppercase; text-align: center;
        width: 9em; color: var(--ui); background: transparent; border: none; border-bottom: 2px solid var(--ui); outline: none; caret-color: var(--ui); }
      .ui-name .why { color: #ff7a6a; min-height: 1em; }
      /* the settlement: a big company printout over the climb */
      .ui-settle { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, 90vw); display: none; padding: 18px 26px;
        border-color: var(--ui); background-color: rgba(8, 9, 8, 0.86); z-index: 7; }
      .ui-settle.open { display: block; }
      .ui-settle .title { font-size: 34px; letter-spacing: 0.16em; border-bottom: 2px dashed var(--ui-dim); padding-bottom: 4px; margin-bottom: 4px; }
      .ui-settle .title.small { font-size: 24px; margin-top: 14px; }
      .ui-settle .sub { color: var(--ui-dim); margin-bottom: 12px; }
      .ui-settle .head, .ui-settle .row, .ui-settle .total { display: flex; gap: 14px; padding: 2px 0; }
      .ui-settle .head { color: var(--ui-dim); border-bottom: 1px solid var(--ui-dim); margin-bottom: 4px; }
      .ui-settle .head > span, .ui-settle .row > span { min-width: 3.4em; text-align: right; }
      .ui-settle .name { flex: 1; text-align: left !important; }
      .ui-settle .num { min-width: 7em !important; font-variant-numeric: tabular-nums; }
      .ui-settle .row, .ui-settle .total { opacity: 0; transform: translateX(-6px); transition: opacity 0.25s steps(3), transform 0.25s steps(3); }
      .ui-settle .row.in, .ui-settle .total.in { opacity: 1; transform: none; }
      .ui-settle .row.me { color: #fff; text-shadow: 0 0 8px var(--ui-glow); }
      .ui-settle .minus { color: #ff8a7a; }
      .ui-settle .total { margin-top: 8px; padding-top: 6px; border-top: 2px solid var(--ui); font-size: 30px; }
      .ui-settle .tag { font-weight: 400; color: #0b0c0e; background: var(--ui); padding: 0 6px; text-shadow: none; }
      .ui-thanks { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        color: var(--ui); font: var(--ui-font); letter-spacing: 0.2em; text-transform: uppercase; z-index: 8; pointer-events: none;
        text-shadow: 0 0 10px var(--ui-glow); }
      .ui-thanks.open { display: flex; }
      .ui-thanks .logo { width: min(440px, 80vw); }
      .ui-thanks .logo svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 0 6px var(--ui-glow)); }
      .ui-thanks .sub { color: var(--ui); font-size: 26px; letter-spacing: 0.3em; padding-left: 0.3em; }
      .ui-thanks .line { color: var(--ui-dim); font-size: 22px; }
      .ui-thanks .line.big { color: var(--ui); font-size: 34px; margin-top: 18px; }
      .ui-wounds { left: 14px; bottom: 40px; display: none; }
      .ui-wounds .pip { display: inline-block; width: 12px; height: 12px; margin-right: 4px; border: 2px solid var(--ui-dim); }
      .ui-wounds .pip.hit { background: #ff5a5a; border-color: #ff5a5a; }
      .ui-wounds .pip.dressed { border-style: dotted; border-color: #ff5a5a; }
      .ui-wounds .w { color: #d8d8d8; }
      .ui-spectate { left: 50%; bottom: 64px; transform: translateX(-50%); display: none; text-align: center; }
      .ui-banner { top: 30%; left: 50%; transform: translateX(-50%); font-size: 30px; letter-spacing: 0.12em;
        padding: 8px 26px; opacity: 0; transition: opacity 0.6s steps(4); border-color: var(--ui); white-space: nowrap; }
      .ui-ride { position: fixed; right: 22px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column;
        align-items: center; gap: 8px; pointer-events: none; opacity: 0; transition: opacity 0.4s; }
      .ui-ride-track { width: 4px; height: 160px; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.3) 0 6px, transparent 6px 8px); position: relative; }
      .ui-ride-fill { position: absolute; left: -2px; width: 8px; top: 0; background: repeating-linear-gradient(0deg, var(--ui) 0 6px, transparent 6px 8px); }
      .ui-ride-label { color: var(--ui); font: var(--ui-font); letter-spacing: 0.14em; text-transform: uppercase;
        writing-mode: vertical-rl; text-shadow: 0 0 6px var(--ui-glow), 0 1px 0 #000; }
      .ui-countdown { position: fixed; left: 50%; top: 18vh; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center;
        color: var(--ui); text-transform: uppercase; letter-spacing: 0.12em; pointer-events: none; opacity: 0; transition: opacity 0.3s steps(4);
        text-shadow: 0 0 10px var(--ui-glow), 0 2px 0 #000; -webkit-font-smoothing: none; z-index: 6; }
      .ui-countdown.open { opacity: 1; }
      .ui-countdown .cd-num { font: 400 88px/0.9 "VT323", ui-monospace, monospace; padding: 0 18px; border: 2px solid var(--ui); background: var(--ui-wash); }
      .ui-countdown .cd-text { font: var(--ui-font); font-size: 22px; margin-top: 6px; padding: 2px 10px; background: var(--ui-wash); white-space: nowrap; }
      .ui-wipe { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 5; }
      .ui-report { right: 16px; top: 90px; min-width: 240px; max-width: min(320px, 80vw); padding: 12px 16px;
        background-color: rgba(8, 10, 12, 0.8); opacity: 0; transform: translateX(16px); transition: opacity 0.3s, transform 0.3s; z-index: 6; }
      .ui-report.open { opacity: 1; transform: none; }
      .ui-report .title { margin-bottom: 6px; padding-bottom: 3px; border-bottom: 2px dashed var(--ui-dim); font-size: 24px; }
      .ui-report .title.sub { margin-top: 8px; }
      .ui-report .run, .ui-report .dim, .ui-report .legend { color: var(--ui-dim); }
      .ui-report .legend { margin-top: 8px; }
      .ui-report .row { display: flex; gap: 10px; padding: 1px 0; }
      .ui-report .row.total { margin-top: 4px; padding-top: 4px; border-top: 2px dashed var(--ui-dim); font-size: 22px; }
      .ui-report .score { margin-left: auto; font-variant-numeric: tabular-nums; }
      #fatal-error {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: #111; color: #eee; font: 15px/1.5 system-ui, sans-serif;
        text-align: center; padding: 24px;
      }
      #fatal-error div { max-width: 440px; }
      #connection-lost { left: 50%; top: 14px; transform: translateX(-50%); display: none; }
      #version {
        position: fixed; right: 6px; bottom: 4px; padding: 1px 6px; color: var(--ui); background: var(--ui-wash);
        font: var(--ui-font); font-size: 16px; letter-spacing: 0.04em; pointer-events: none; z-index: 7;
        text-shadow: 0 0 4px var(--ui-glow); -webkit-font-smoothing: none;
      }
    </style>
  </head>
  <body>
    <div id="hint"><span id="controls">WASD move</span> &middot; <a href="/readme/">about</a></div>
    <div id="tip"></div>
    <div id="respawn"></div>
    <div id="leaderboard"></div>
    <div id="connection-lost">reconnecting&hellip;</div>
    <div id="fatal-error"><div></div></div>
    <div id="version"></div>
    <script type="module" src="/bundle.js"></script>
  </body>
</html>
