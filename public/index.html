<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commons</title>
    <style>
      /* One look for every piece of UI: thin white line-work, monospace caps,
         a bracket at two corners, a faint dark wash behind so it reads on the
         bright garden and in the dark alike. Grey is "not available". */
      :root { --ui: #ffffff; --ui-dim: #a8a8a8; --ui-wash: rgba(8, 10, 12, 0.38);
        --ui-font: 600 11px/1.35 ui-monospace, "SF Mono", Menlo, monospace; }
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      canvas { display: block; }
      .ui-frame, #leaderboard, #board .board-panel, .ui-hud, .ui-wounds, .ui-spectate, .ui-banner, #connection-lost {
        position: fixed; color: var(--ui); font: var(--ui-font); letter-spacing: 0.1em; text-transform: uppercase;
        background: var(--ui-wash); padding: 8px 12px; pointer-events: none; text-shadow: 0 0 4px rgba(0,0,0,0.5);
        border: 0; border-radius: 0;
        background-image:
          linear-gradient(var(--ui), var(--ui)), linear-gradient(var(--ui), var(--ui)),
          linear-gradient(var(--ui), var(--ui)), linear-gradient(var(--ui), var(--ui));
        background-repeat: no-repeat;
        background-size: 8px 1px, 1px 8px, 8px 1px, 1px 8px;
        background-position: top left, top left, bottom right, bottom right;
        background-color: var(--ui-wash);
      }
      #hint {
        position: fixed; left: 14px; bottom: 12px; color: var(--ui); font: var(--ui-font);
        letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.85; pointer-events: none;
        text-shadow: 0 0 4px rgba(0,0,0,0.6);
      }
      #hint a { pointer-events: auto; color: var(--ui-dim); }
      #tip {
        position: fixed; left: 0; top: 0; display: none; pointer-events: none;
        color: var(--ui); font: var(--ui-font); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
        border-left: 1px solid var(--ui); padding: 2px 8px; background: var(--ui-wash);
      }
      #respawn {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: var(--ui); font: 300 56px ui-monospace, monospace; text-shadow: 0 0 10px #000;
        pointer-events: none; display: none;
      }
      #leaderboard { left: 14px; top: 14px; min-width: 150px; }
      #leaderboard .row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
      #leaderboard .swatch { width: 7px; height: 7px; flex: none; border: 1px solid var(--ui); }
      #leaderboard .score { margin-left: auto; font-variant-numeric: tabular-nums; }
      #leaderboard .me { color: var(--ui); }
      #leaderboard .row:not(.me) { color: #d8d8d8; }
      /* the scoreboard: closed, it's only the screen in the garden; open, a tall panel mid-screen */
      #board { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; }
      #board .board-panel { position: relative; min-width: 300px; max-width: min(420px, 86vw); padding: 18px 22px;
        background-color: rgba(8, 10, 12, 0.84); background-size: 14px 1px, 1px 14px, 14px 1px, 1px 14px;
        opacity: 0; transform: translateY(8px) scaleY(0.96); transition: opacity 0.22s, transform 0.22s; }
      #board.open .board-panel { opacity: 1; transform: none; }
      #board .title { margin: 6px 0 4px; padding-bottom: 3px; border-bottom: 1px solid rgba(255,255,255,0.35); }
      #board .run { color: var(--ui-dim); margin-bottom: 6px; }
      #board .row { display: flex; gap: 8px; padding: 2px 0; }
      #board .rank { width: 1.4em; color: var(--ui-dim); }
      #board .score { margin-left: auto; font-variant-numeric: tabular-nums; }
      #board .dim, #board .legend { color: var(--ui-dim); }
      #board .legend { margin-top: 8px; font-size: 9px; }
      .ui-hud { top: 14px; left: 50%; transform: translateX(-50%); width: min(360px, 70vw); display: none; }
      .ui-hud .line { display: flex; justify-content: space-between; margin-bottom: 4px; }
      .ui-hud .bar { height: 6px; border: 1px solid var(--ui); margin-bottom: 8px; position: relative; }
      .ui-hud .bar > div { position: absolute; left: 1px; top: 1px; bottom: 1px; background: var(--ui); transition: width 0.3s; }
      .ui-hud .bar.hp > div.low { background: #ff5a5a; }
      .ui-hud .next { color: var(--ui-dim); }
      .ui-wounds { left: 14px; bottom: 40px; display: none; }
      .ui-wounds .pip { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border: 1px solid var(--ui-dim); }
      .ui-wounds .pip.hit { background: #ff5a5a; border-color: #ff5a5a; }
      .ui-wounds .w { color: #d8d8d8; }
      .ui-spectate { left: 50%; bottom: 64px; transform: translateX(-50%); display: none; text-align: center; }
      .ui-banner { top: 18%; left: 50%; transform: translateX(-50%); font-size: 15px; letter-spacing: 0.18em;
        padding: 10px 24px; opacity: 0; transition: opacity 0.6s; background-size: 12px 1px, 1px 12px, 12px 1px, 1px 12px; }
      .ui-ride { position: fixed; right: 22px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column;
        align-items: center; gap: 8px; pointer-events: none; opacity: 0; transition: opacity 0.4s; }
      .ui-ride-track { width: 1px; height: 160px; background: rgba(255,255,255,0.35); position: relative; }
      .ui-ride-fill { position: absolute; left: -1px; width: 3px; top: 0; background: var(--ui); }
      .ui-ride-label { color: var(--ui); font: var(--ui-font); letter-spacing: 0.14em; text-transform: uppercase;
        writing-mode: vertical-rl; text-shadow: 0 0 4px #000; }
      #fatal-error {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: #111; color: #eee; font: 15px/1.5 system-ui, sans-serif;
        text-align: center; padding: 24px;
      }
      #fatal-error div { max-width: 440px; }
      #connection-lost { left: 50%; top: 14px; transform: translateX(-50%); display: none; }
    </style>
  </head>
  <body>
    <div id="hint"><span id="controls">WASD move</span> &middot; <a href="/readme/">about</a></div>
    <div id="tip"></div>
    <div id="respawn"></div>
    <div id="leaderboard"></div>
    <div id="connection-lost">reconnecting&hellip;</div>
    <div id="fatal-error"><div></div></div>
    <script type="module" src="/bundle.js"></script>
  </body>
</html>
