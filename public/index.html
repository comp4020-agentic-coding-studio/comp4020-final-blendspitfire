<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asset Nexus Unlimited</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Homemade+Apple&display=swap" rel="stylesheet" />
    <style>
      /* One look for every piece of UI: an old company terminal. A pixel
         face in a warm phosphor white with a faint glow, chunky two-pixel
         frames with stepped corners, a dark wash behind so it reads on the
         bright garden and in the dark alike. Grey is "not available". */
      :root { --ui: #f2ead6; --ui-dim: #8f8a7e; --ui-wash: rgba(6, 8, 6, 0.62); --ui-glow: rgba(255, 220, 160, 0.35);
        --ui-font: 400 19px/1.05 "VT323", ui-monospace, "SF Mono", Menlo, monospace; }
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      canvas { display: block; }
      .ui-frame, #leaderboard, #board .board-panel, #shop .board-panel, .ui-report, .ui-hud, .ui-ready, .ui-settle, .ui-wounds, .ui-spectate, .ui-banner, #connection-lost {
        position: fixed; color: var(--ui); font: var(--ui-font); letter-spacing: 0.06em; text-transform: uppercase;
        padding: 8px 12px; pointer-events: none; text-shadow: 0 0 6px var(--ui-glow), 0 1px 0 #000;
        border: 2px solid var(--ui-dim); border-radius: 0;
        /* stepped corners: the frame's corners knocked out one pixel-step, like a sprite's */
        clip-path: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px,
          100% calc(100% - 4px), calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%,
          4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 2px 4px, 2px 2px, 4px 2px);
        background-color: var(--ui-wash);
        /* faint scanlines through every panel */
        background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
        image-rendering: pixelated; -webkit-font-smoothing: none; font-smooth: never;
      }
      #hint {
        position: fixed; left: 14px; bottom: 10px; color: var(--ui); font: var(--ui-font);
        letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.9; pointer-events: none;
        text-shadow: 0 0 6px var(--ui-glow), 0 1px 0 #000; -webkit-font-smoothing: none;
      }
      #hint::before { content: "> "; color: var(--ui-dim); }
      #hint a { pointer-events: auto; color: var(--ui-dim); }
      #tip {
        position: fixed; left: 0; top: 0; display: none; pointer-events: none;
        color: var(--ui); font: var(--ui-font); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
        border-left: 4px solid var(--ui); padding: 2px 8px; background: var(--ui-wash); text-shadow: 0 0 6px var(--ui-glow);
      }
      #respawn {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: var(--ui); font: 400 96px "VT323", ui-monospace, monospace; text-shadow: 0 0 14px var(--ui-glow), 0 3px 0 #000;
        pointer-events: none; display: none;
      }
      #leaderboard { left: 14px; top: 14px; min-width: 150px; }
      #leaderboard .row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
      #leaderboard .swatch { width: 10px; height: 10px; flex: none; border: 2px solid var(--ui-dim); }
      #leaderboard .score { margin-left: auto; font-variant-numeric: tabular-nums; }
      #leaderboard .me { color: var(--ui); }
      #leaderboard .row:not(.me) { color: #d8d8d8; }
      /* the scoreboard: closed, it's only the screen in the garden; open, a tall panel mid-screen */
      #board, #shop { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; }
      #shop { place-items: center end; padding-right: 4vw; }
      #shop.open .board-panel { pointer-events: auto; }
      #shop .row { cursor: pointer; flex-wrap: wrap; }
      #shop .key { width: 2.4em; }
      #shop .why { flex-basis: 100%; padding-left: 2.4em; font-size: 16px; }
      #shop .row:not(.dim):hover { background: var(--ui); color: #0a0c0a; text-shadow: none; }
      #board .board-panel, #shop .board-panel { position: relative; min-width: 300px; max-width: min(420px, 86vw); padding: 18px 22px;
        background-color: rgba(6, 8, 6, 0.88);
        opacity: 0; transform: translateY(8px) scaleY(0.96); transition: opacity 0.22s, transform 0.22s; }
      #board.open .board-panel, #shop.open .board-panel { opacity: 1; transform: none; }
      #board .title, #shop .title { margin: 6px 0 4px; padding-bottom: 3px; border-bottom: 2px dashed var(--ui-dim); font-size: 24px; }
      #board .run, #shop .run { color: var(--ui-dim); margin-bottom: 6px; }
      #board .row, #shop .row { display: flex; gap: 8px; padding: 2px 0; }
      #board .rank { width: 1.4em; color: var(--ui-dim); }
      #board .score, #shop .score { margin-left: auto; font-variant-numeric: tabular-nums; }
      #board .dim, #board .legend, #shop .dim, #shop .legend { color: var(--ui-dim); }
      #board .legend, #shop .legend { margin-top: 8px; font-size: 16px; }
      .ui-hud { top: 10px; left: 50%; transform: translateX(-50%); display: none; padding: 3px 12px; font-size: 17px; opacity: 0.92; }
      .ui-hud .line { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
      /* the reactor as a thin row of blocks lit up to its health, not a smooth fill */
      .ui-hud .bar { display: inline-block; width: 120px; height: 6px; border: 1px solid var(--ui-dim); position: relative; padding: 1px; }
      .ui-hud .bar > span { display: block; height: 100%; transition: width 0.3s steps(8);
        background: repeating-linear-gradient(90deg, var(--ui) 0 5px, transparent 5px 7px); }
      .ui-hud .bar.hp > span.low { background: repeating-linear-gradient(90deg, #ff5a4a 0 5px, transparent 5px 7px); }
      /* hit: the frame and blocks blink alarm red, two hard steps, while the reactor is losing health */
      .ui-hud .bar.hp.hit { border-color: #ff5a4a; animation: hp-hit 0.3s steps(2) infinite; }
      .ui-hud .bar.hp.hit > span { background: repeating-linear-gradient(90deg, #ff5a4a 0 5px, transparent 5px 7px); }
      @keyframes hp-hit { 50% { opacity: 0.25; } }
      .ui-hud .next { color: var(--ui-dim); }
      .ui-ready { left: 50%; bottom: 46px; transform: translateX(-50%); display: none; align-items: center; gap: 12px;
        padding: 6px 16px 6px 8px; border-color: var(--ui); white-space: nowrap; }
      .ui-ready.open { display: flex; }
      .ui-ready .key { font-size: 30px; line-height: 1; padding: 2px 10px 0; border: 2px solid var(--ui); color: #0b0c0e; background: var(--ui);
        text-shadow: none; animation: ready-pulse 1.2s step-end infinite; }
      .ui-ready.done .key { background: transparent; color: var(--ui-dim); border-color: var(--ui-dim); animation: none; }
      .ui-ready .what { font-size: 22px; }
      .ui-ready .who { color: var(--ui-dim); }
      @keyframes ready-pulse { 0% { background: var(--ui); color: #0b0c0e; } 50% { background: transparent; color: var(--ui); } }
      /* the settlement: a big company printout over the climb */
      .ui-settle { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, 90vw); display: none; padding: 18px 26px;
        border-color: var(--ui); background-color: rgba(8, 9, 8, 0.86); z-index: 7; }
      .ui-settle.open { display: block; }
      .ui-settle .title { font-size: 34px; letter-spacing: 0.16em; border-bottom: 2px dashed var(--ui-dim); padding-bottom: 4px; margin-bottom: 4px; }
      .ui-settle .title.small { font-size: 24px; margin-top: 14px; }
      .ui-settle .sub { color: var(--ui-dim); margin-bottom: 12px; }
      .ui-settle .head, .ui-settle .row, .ui-settle .total { display: flex; gap: 14px; padding: 2px 0; }
      .ui-settle .head { color: var(--ui-dim); border-bottom: 1px solid var(--ui-dim); margin-bottom: 4px; }
      .ui-settle .head > span, .ui-settle .row > span, .ui-settle .gross > span { min-width: 3.4em; text-align: right; }
      .ui-settle .name { flex: 1; text-align: left !important; }
      .ui-settle .num { min-width: 7em !important; font-variant-numeric: tabular-nums; }
      .ui-settle .row, .ui-settle .total { opacity: 0; transform: translateX(-6px); transition: opacity 0.25s steps(3), transform 0.25s steps(3); }
      .ui-settle .row.in, .ui-settle .total.in { opacity: 1; transform: none; }
      .ui-settle .row.me { color: #fff; text-shadow: 0 0 8px var(--ui-glow); }
      .ui-settle .minus { color: #ff8a7a; }
      .ui-settle .total { margin-top: 8px; padding-top: 6px; border-top: 2px solid var(--ui); font-size: 30px; }
      /* the payslip (ADR-079): a big green gross, cuts a second apart, a rule, the net, and a red PAID stamp slammed on it */
      .ui-settle .gross { display: flex; gap: 14px; font-size: 40px; color: #8fe39a; text-shadow: 0 0 12px rgba(143, 227, 154, 0.5), 0 1px 0 #000;
        margin-bottom: 6px; opacity: 0; transition: opacity 0.4s steps(4); }
      .ui-settle .gross.in { opacity: 1; }
      .ui-settle .rule { height: 0; border-top: 2px solid var(--ui); margin-top: 8px; transform: scaleX(0); transform-origin: left;
        transition: transform 0.5s steps(6); }
      .ui-settle .rule.in { transform: none; }
      .ui-settle .rule + .total { border-top: 0; margin-top: 2px; position: relative; }
      .ui-settle .paid { position: absolute; left: 34%; top: 50%; pointer-events: none; opacity: 0;
        transform: translateY(-50%) rotate(-12deg) scale(3); }
      .ui-settle .paid canvas { display: block; filter: drop-shadow(0 0 6px rgba(255, 90, 72, 0.5)); }
      .ui-settle.stamped .paid { opacity: 0.92; transform: translateY(-50%) rotate(-12deg) scale(1);
        transition: transform 0.12s steps(3), opacity 0.12s steps(3); }
      .ui-settle.stamped .total .num { color: #8fe39a; font-size: 1.35em; text-shadow: 0 0 14px rgba(143, 227, 154, 0.6), 0 1px 0 #000; }
      .ui-settle.stamped { animation: paid-thud 0.3s steps(6) 0.12s; }
      @keyframes paid-thud { 0% { translate: 0 0; } 25% { translate: -4px 3px; } 50% { translate: 3px -2px; } 75% { translate: -2px 1px; } 100% { translate: 0 0; } }
      .ui-settle .tag { font-weight: 400; color: #0b0c0e; background: var(--ui); padding: 0 6px; text-shadow: none; }
      .ui-thanks { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        color: var(--ui); font: var(--ui-font); letter-spacing: 0.2em; text-transform: uppercase; z-index: 8; pointer-events: none;
        text-shadow: 0 0 10px var(--ui-glow); }
      .ui-thanks.open { display: flex; }
      .ui-thanks .logo canvas { display: block; height: auto; filter: drop-shadow(0 0 6px var(--ui-glow)); }
      .ui-thanks .sub { color: var(--ui); font-size: 26px; letter-spacing: 0.3em; padding-left: 0.3em; }
      .ui-thanks .stamp canvas { display: block; filter: drop-shadow(0 0 6px var(--ui-glow)); }
      .ui-thanks .line { color: var(--ui-dim); font-size: 22px; }
      .ui-thanks .line.big { color: var(--ui); font-size: 34px; }
      /* the end credits: one column, scrolled by transform from the first card to the last */
      .ui-thanks { justify-content: flex-start; overflow: hidden; }
      .ui-thanks .roll { display: flex; flex-direction: column; align-items: center; will-change: transform; }
      .ui-thanks .card { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 10vh; }
      .ui-thanks .card.last { margin-bottom: 0; }
      .ui-thanks .head { color: var(--ui-dim); font-size: 22px; letter-spacing: 0.3em; margin-bottom: 8px; }
      .ui-thanks .cast { display: grid; grid-template-columns: 7em 9em 4em; gap: 18px; font-size: 26px; }
      .ui-thanks .cast .role { color: var(--ui-dim); text-align: right; }
      .ui-thanks .cast .pts { color: var(--ui-dim); font-variant-numeric: tabular-nums; }
      .ui-thanks .cast.me .who { text-shadow: 0 0 12px var(--ui-glow); color: #fff; }
      .ui-thanks .dim { color: var(--ui-dim); }
      .ui-thanks .cast.solo { display: block; text-align: center; }
      .ui-thanks .cast.credit { grid-template-columns: 7em 22em; }
      .ui-thanks .card .line { text-align: center; margin-top: 18px; line-height: 1.3; }
      .ui-thanks .card .line.thanks-all { color: #fff; font-size: 26px; text-shadow: 0 0 12px var(--ui-glow); }
      .ui-wounds { left: 14px; bottom: 40px; display: none; }
      .ui-wounds .pip { display: inline-block; width: 12px; height: 12px; margin-right: 4px; border: 2px solid var(--ui-dim); }
      .ui-wounds .pip.hit { background: #ff5a5a; border-color: #ff5a5a; }
      .ui-wounds .pip.dressed { border-style: dotted; border-color: #ff5a5a; }
      .ui-wounds .w { color: #d8d8d8; }
      .ui-spectate { left: 50%; bottom: 64px; transform: translateX(-50%); display: none; text-align: center; }
      .ui-banner { top: 30%; left: 50%; transform: translateX(-50%); font-size: 30px; letter-spacing: 0.12em;
        padding: 8px 26px; opacity: 0; transition: opacity 0.6s steps(4); border-color: var(--ui); white-space: nowrap; }
      .ui-ride { position: fixed; right: 22px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column;
        align-items: flex-end; gap: 8px; pointer-events: none; opacity: 0; transition: opacity 0.4s; }
      /* the altitude ruler: ticks scroll behind a fixed cursor at the window's middle */
      .ui-ride-window { position: relative; width: 64px; height: 200px; overflow: hidden;
        -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); }
      .ui-ride-scale { position: absolute; left: 0; right: 0; top: 100px; }
      .ui-ride-scale .tick { position: absolute; right: 0; width: 10px; height: 2px; background: var(--ui-dim); }
      .ui-ride-scale .tick.major { width: 20px; background: var(--ui); }
      .ui-ride-scale .tick span { position: absolute; right: 26px; top: -9px; color: var(--ui-dim); font: var(--ui-font); font-size: 16px; letter-spacing: 0.04em; }
      .ui-ride-cursor { position: absolute; right: 0; top: 99px; width: 40px; height: 4px; background: var(--ui); box-shadow: 0 0 6px var(--ui-glow); }
      .ui-ride-cursor::before { content: ""; position: absolute; left: -8px; top: -4px; border: 6px solid transparent; border-right: 8px solid var(--ui); border-left: 0; }
      .ui-ride-num { color: var(--ui); font: var(--ui-font); font-size: 26px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
        min-width: 4.2em; text-align: right; text-shadow: 0 0 6px var(--ui-glow), 0 1px 0 #000; background: var(--ui-wash); padding: 1px 6px; }
      .ui-ride-label { color: var(--ui-dim); font: var(--ui-font); font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase;
        text-shadow: 0 0 6px var(--ui-glow), 0 1px 0 #000; }
      /* the contract (ADR-087): the company's terms between the tutorial and the dig site, page by page, signed and stamped */
      .ui-contract { position: fixed; inset: 0; display: none; place-items: center; z-index: 25; background: rgba(4, 5, 4, 0.7); pointer-events: auto; }
      .ui-contract.open { display: grid; }
      .ui-contract .doc { width: min(600px, calc(100vw - 32px)); box-sizing: border-box; padding: 14px 20px 14px; color: var(--ui); font: var(--ui-font);
        letter-spacing: 0.05em; background: rgba(8, 9, 8, 0.94); border: 2px solid var(--ui); text-shadow: 0 0 6px var(--ui-glow), 0 1px 0 #000;
        background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px); }
      .ui-contract .top { display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: 0.14em; font-size: 22px;
        border-bottom: 2px dashed var(--ui-dim); padding-bottom: 4px; margin-bottom: 10px; }
      .ui-contract .top .pg { color: var(--ui-dim); font-size: 16px; }
      .ui-contract .page { display: flex; flex-direction: column; gap: 12px; min-height: 240px; justify-content: center; font-size: 21px; line-height: 1.2; }
      .ui-contract .seal { display: flex; justify-content: center; margin-bottom: 6px; }
      .ui-contract .seal canvas, .ui-contract .art canvas { display: block; filter: drop-shadow(0 0 6px var(--ui-glow)); }
      .ui-contract .steps { display: flex; align-items: flex-start; justify-content: center; gap: 6px; }
      .ui-contract .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; max-width: 150px; }
      .ui-contract .step .say { font-size: 18px; line-height: 1.1; }
      .ui-contract .step .say b { color: var(--ui-dim); }
      .ui-contract .then { color: var(--ui-dim); font-size: 22px; padding-top: 38px; }
      .ui-contract p { margin: 0 0 10px; }
      .ui-contract ol { margin: 0; padding-left: 1.6em; }
      .ui-contract li { margin-bottom: 8px; }
      .ui-contract .dim { color: var(--ui-dim); }
      .ui-contract .big { font-size: 30px; text-transform: uppercase; letter-spacing: 0.2em; margin: 6px 0 14px; }
      .ui-contract .kv { display: flex; gap: 12px; padding: 2px 0; text-transform: uppercase; }
      .ui-contract .kv span { color: var(--ui-dim); min-width: 7em; }
      .ui-contract .pay { display: flex; flex-direction: column; align-items: center; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.12em; }
      .ui-contract .pay b { font-size: 52px; line-height: 1; letter-spacing: 0.06em; margin: 2px 0; font-weight: 400; }
      .ui-contract .pay span:last-child { text-transform: none; letter-spacing: 0.05em; font-size: 17px; }
      .ui-contract .sigline { position: relative; height: 104px; border-bottom: 2px solid var(--ui); margin: 14px 0 6px; }
      .ui-contract .sig { position: absolute; left: 8px; bottom: 2px; }
      .ui-contract .sig canvas, .ui-contract .stamp canvas { display: block; }
      .ui-contract .stamp { position: absolute; right: 10px; top: 50%; transform: translateY(-50%) rotate(-8deg) scale(3); opacity: 0; }
      .ui-contract .stamp canvas { filter: drop-shadow(0 0 6px rgba(255, 90, 72, 0.5)); }
      .ui-contract.stamped .stamp { opacity: 0.92; transform: translateY(-50%) rotate(-8deg) scale(1); transition: transform 0.12s steps(3), opacity 0.12s steps(3); }
      .ui-contract.stamped .doc { animation: paid-thud 0.3s steps(6) 0.12s; }
      .ui-contract .nav { display: flex; justify-content: space-between; margin-top: 12px; }
      .ui-contract button { font: var(--ui-font); font-size: 20px; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; color: var(--ui);
        background: transparent; border: 2px solid var(--ui-dim); padding: 3px 14px; text-shadow: inherit; }
      .ui-contract button.go { border-color: var(--ui); }
      .ui-contract button.dim { color: var(--ui-dim); }
      .ui-contract button:hover { background: var(--ui); color: #0a0c0a; text-shadow: none; }
      .ui-countdown { position: fixed; left: 50%; top: 18vh; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center;
        color: var(--ui); text-transform: uppercase; letter-spacing: 0.12em; pointer-events: none; opacity: 0; transition: opacity 0.3s steps(4);
        text-shadow: 0 0 10px var(--ui-glow), 0 2px 0 #000; -webkit-font-smoothing: none; z-index: 6; }
      .ui-countdown.open { opacity: 1; }

      .ui-countdown .cd-text { font: var(--ui-font); font-size: 22px; margin-top: 6px; padding: 2px 10px; background: var(--ui-wash); white-space: nowrap; }
      .ui-wipe { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 5; }
      .ui-report { right: 16px; top: 90px; min-width: 320px; max-width: min(440px, 86vw); padding: 14px 20px; font-size: 24px;
        background-color: rgba(8, 10, 12, 0.8); opacity: 0; transform: translateX(16px); transition: opacity 0.3s, transform 0.3s; z-index: 6; }
      .ui-report.open { opacity: 1; transform: none; }
      .ui-report .title { margin-bottom: 8px; padding-bottom: 4px; border-bottom: 2px dashed var(--ui-dim); font-size: 32px; }
      .ui-report .title.sub { margin-top: 8px; }
      .ui-report .run, .ui-report .dim, .ui-report .legend { color: var(--ui-dim); }
      .ui-report .legend { margin-top: 8px; }
      .ui-report .row { display: flex; gap: 10px; padding: 1px 0; }
      .ui-report .row.total { margin-top: 6px; padding-top: 6px; border-top: 2px dashed var(--ui-dim); font-size: 28px; }
      .ui-report .score { margin-left: auto; font-variant-numeric: tabular-nums; }
      /* the title screen: the seal, a name, the sites to join; the scene dimmed behind */
      .ui-title, .ui-pause { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        color: var(--ui); font: var(--ui-font); letter-spacing: 0.06em; text-transform: uppercase; z-index: 30;
        background: rgba(4, 5, 4, 0.82); text-shadow: 0 0 6px var(--ui-glow), 0 1px 0 #000; -webkit-font-smoothing: none; }
      .ui-title.open, .ui-pause.open { display: flex; }

      .ui-title .logo canvas { display: block; margin-bottom: 10px; filter: drop-shadow(0 0 6px var(--ui-glow)); }
      .ui-title .dim, .ui-pause .dim { color: var(--ui-dim); }
      .ui-title .small { font-size: 16px; margin-bottom: 10px; }
      .ui-title .field { display: flex; align-items: baseline; gap: 12px; }

      .ui-title input::placeholder { color: var(--ui-dim); opacity: 0.6; }
