<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commons</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      canvas { display: block; }
      #hint {
        position: fixed; left: 12px; bottom: 12px; color: #eee;
        font: 14px system-ui, sans-serif; opacity: 0.8; pointer-events: none;
      }
      #respawn {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: #fff; font: bold 48px system-ui, sans-serif; text-shadow: 0 2px 8px #000;
        pointer-events: none; display: none;
      }
      #leaderboard {
        position: fixed; left: 12px; top: 12px; color: #eee;
        font: 13px system-ui, sans-serif; background: rgba(0, 0, 0, 0.35);
        border-radius: 6px; padding: 8px 10px; pointer-events: none; min-width: 120px;
      }
      #leaderboard .row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
      #leaderboard .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
      #leaderboard .score { margin-left: auto; font-variant-numeric: tabular-nums; }
      #leaderboard .me { font-weight: bold; }
      #fatal-error {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: #111; color: #eee; font: 15px/1.5 system-ui, sans-serif;
        text-align: center; padding: 24px;
      }
      #fatal-error div { max-width: 440px; }
      #connection-lost {
        position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
        color: #fff; font: 13px system-ui, sans-serif; background: rgba(140, 20, 20, 0.85);
        border-radius: 6px; padding: 6px 12px; display: none; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hint"><span id="controls">WASD / arrow keys to move</span> &middot; <a href="/readme/" style="color:#9cf">about</a></div>
    <div id="respawn"></div>
    <div id="leaderboard"></div>
    <div id="connection-lost">reconnecting&hellip;</div>
    <div id="fatal-error"><div></div></div>
    <script type="module" src="/bundle.js"></script>
  </body>
</html>
